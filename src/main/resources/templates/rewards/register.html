<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Đổi điểm tích lũy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
            position: relative;
        }

        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 6px; height: 6px;
            background: rgba(99, 102, 241, 0.5);
            border-radius: 50%;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .register-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px; color: white;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 10px 40px rgba(99, 102, 241, 0.5); }
        }
        .logo-title { color: white; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .logo-subtitle { color: rgba(255, 255, 255, 0.5); font-size: 14px; }

        /* Bonus banner */
        .bonus-banner {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.1));
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
            animation: glow-pulse 2s infinite;
        }
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 0 rgba(245, 158, 11, 0); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }
        }
        .bonus-banner .bonus-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .bonus-banner .bonus-text {
            color: #fbbf24;
            font-size: 15px;
            font-weight: 700;
        }
        .bonus-banner .bonus-sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-top: 4px;
        }

        .form-group { margin-bottom: 18px; }
        .form-label {
            display: block; color: rgba(255, 255, 255, 0.7);
            font-size: 13px; font-weight: 500; margin-bottom: 8px; letter-spacing: 0.5px;
        }
        .form-label .required { color: #f87171; }
        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3); font-size: 16px; transition: color 0.3s;
        }
        .form-input {
            width: 100%; padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: white; font-size: 15px;
            font-family: 'Inter', sans-serif; outline: none; transition: all 0.3s ease;
        }
        .form-input::placeholder { color: rgba(255, 255, 255, 0.25); }
        .form-input:focus {
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .input-wrapper:focus-within i { color: #6366f1; }

        /* Password row */
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group { flex: 1; }

        .btn-register {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.3s ease;
            margin-top: 8px; letter-spacing: 0.5px;
            position: relative; overflow: hidden;
        }
        .btn-register::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-register:hover::before { left: 100%; }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .login-link {
            display: block; text-align: center; margin-top: 20px;
            color: rgba(255, 255, 255, 0.5); font-size: 14px;
        }
        .login-link a {
            color: #a5b4fc; text-decoration: none; font-weight: 600;
            transition: color 0.3s;
        }
        .login-link a:hover { color: #6366f1; text-decoration: underline; }

        .back-link {
            display: block; text-align: center; margin-top: 16px;
            color: rgba(255, 255, 255, 0.4); text-decoration: none;
            font-size: 14px; transition: color 0.3s;
        }
        .back-link:hover { color: rgba(255, 255, 255, 0.8); }

        .alert {
            padding: 12px 16px; border-radius: 10px; font-size: 14px;
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
            animation: shake 0.4s ease-out;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 500px) {
            .form-row { flex-direction: column; gap: 0; }
            .register-card { padding: 35px 25px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="logo-title">Đăng Ký Tài Khoản</h1>
                <p class="logo-subtitle">Tạo tài khoản để tích điểm và đổi voucher</p>
            </div>

            <!-- Bonus banner -->
            <div class="bonus-banner">
                <div class="bonus-icon">🎁</div>
                <div class="bonus-text">Đăng ký ngay - Nhận 10.000 điểm miễn phí!</div>
                <div class="bonus-sub">Điểm chào mừng thành viên mới</div>
            </div>

            <!-- Error message -->
            <div class="alert alert-error" th:if="${error}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/register}" method="post">
                <div class="form-group">
                    <label class="form-label">HỌ VÀ TÊN <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" name="name" class="form-input" placeholder="Nhập họ tên đầy đủ" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">EMAIL <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="email" name="email" class="form-input" placeholder="Nhập email của bạn" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">SỐ ĐIỆN THOẠI</label>
                    <div class="input-wrapper">
                        <input type="tel" name="phone" class="form-input" placeholder="Nhập số điện thoại (tùy chọn)">
                        <i class="fas fa-phone"></i>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">MẬT KHẨU <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" name="password" class="form-input" placeholder="Ít nhất 4 ký tự" required minlength="4">
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">XÁC NHẬN <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" name="confirmPassword" class="form-input" placeholder="Nhập lại mật khẩu" required>
                            <i class="fas fa-lock"></i>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus" style="margin-right:8px"></i> Đăng ký tài khoản
                </button>
            </form>

            <div class="login-link">
                Đã có tài khoản?
                <a th:href="@{/}">Đăng nhập</a>
            </div>

            <a href="/" class="back-link">
                <i class="fas fa-arrow-left" style="margin-right:5px"></i> Quay lại trang chủ
            </a>
        </div>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 6 + 4) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.width = particle.style.height = (Math.random() * 4 + 3) + 'px';
            container.appendChild(particle);
        }
    </script>
</body>
</html>
